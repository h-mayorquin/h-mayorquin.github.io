<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Redirecting...</title>
  <script>
    // =======================================================================
    // GitHub Pages SPA Redirect
    // =======================================================================
    //
    // WHAT THIS DOES:
    // When someone visits a URL like:
    //   /apps/probe-viewer/probes/imec/NP1000
    //
    // GitHub Pages looks for a file at that exact path. It doesn't exist
    // (there's no folder called "probes"), so GitHub serves this 404.html.
    //
    // This script:
    // 1. Extracts the route the user wanted ("/probes/imec/NP1000")
    // 2. Saves it to sessionStorage (survives the redirect)
    // 3. Redirects to the app root where index.html exists
    //
    // Then main.tsx checks sessionStorage and navigates to the saved route.
    // =======================================================================

    (function() {
      var BASE_PATH = '/apps/probe-viewer';
      var fullPath = window.location.pathname;

      // Extract the route relative to our app
      // Example: "/apps/probe-viewer/probes/imec/NP1000" → "/probes/imec/NP1000"
      var route = '';
      if (fullPath.startsWith(BASE_PATH)) {
        route = fullPath.slice(BASE_PATH.length);
        // Ensure it starts with /
        if (route && !route.startsWith('/')) {
          route = '/' + route;
        }
      }

      // Only save if there's actually a route to preserve
      // (not just "/apps/probe-viewer/" or "/apps/probe-viewer")
      if (route && route !== '/') {
        sessionStorage.setItem('spa-redirect-route', route);
      }

      // Redirect to the app root
      // The trailing slash is important - it tells the server to serve index.html
      window.location.replace(BASE_PATH + '/');
    })();
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
