name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

# Sets permissions of the GITHUB_TOKEN
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/probe-viewer/package-lock.json

      - name: Build probe-viewer
        run: uv run scripts/build_probe_viewer.py

      - name: Prepare deployment
        run: |
          mkdir -p _site

          # Copy root-level static files
          cp -r index.html about.html blog.html _site/ 2>/dev/null || true
          cp -r .nojekyll _site/ 2>/dev/null || true
          cp -r posts.json _site/ 2>/dev/null || true
          cp -r LICENSE _site/ 2>/dev/null || true

          # Copy directories
          cp -r assets _site/ 2>/dev/null || true
          cp -r js _site/ 2>/dev/null || true
          cp -r posts _site/ 2>/dev/null || true
          cp -r files _site/ 2>/dev/null || true
          cp -r notebooks _site/ 2>/dev/null || true

          # Copy apps (static apps + built probe-viewer)
          mkdir -p _site/apps
          cp apps/index.html _site/apps/ 2>/dev/null || true
          cp -r apps/dimension-order-visualizer _site/apps/ 2>/dev/null || true
          cp -r apps/templates-visualizer _site/apps/ 2>/dev/null || true
          cp -r apps/probe-viewer/dist _site/apps/probe-viewer/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
